<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JonesRoad</title>
    <script src="mraid.js"></script>
    <script>
      (function () {
        let mraidIsReady = false;
        let mraidReadyListenerAttached = false;

        function trackMraidReadiness(mraid) {
          if (
            mraidReadyListenerAttached ||
            !mraid ||
            typeof mraid.addEventListener !== "function"
          ) {
            return;
          }

          try {
            mraid.addEventListener("ready", function () {
              mraidIsReady = true;
            });
            mraidReadyListenerAttached = true;
          } catch (error) {
            // getState() remains the primary readiness check.
          }
        }

        window.isMraidUsable = function (mraid) {
          if (!mraid) {
            return false;
          }

          trackMraidReadiness(mraid);
          if (typeof mraid.getState !== "function") {
            return true;
          }

          try {
            const state = mraid.getState();
            return state === "default" || state === "expanded";
          } catch (error) {
            return mraidIsReady;
          }
        };
      })();
    </script>
    <script>
      (function () {
        window.__mip = window.__mip || {};

        // AppLovin loading-state guard, in the exact if/else shape the
        // validator scans for. Must stay here (raw inline script) — see
        // CLAUDE.md for why this can't live in bundled JS.
        window.__mip.ready = function (callback) {
          if (typeof mraid === "undefined") {
            callback();
          } else if (mraid.getState() === "loading") {
            mraid.addEventListener("ready", callback);
          } else {
            callback();
          }
        };

        // Resolve only the platform-injected tag; never assign a default tag.
        // Keep an explicit empty argument for the host-resolved destination.
        window.__mip.openDestination = function handleMraidOpen() {
          var mraid = window.mraid || {};
          var injectedUrl = window.clickTag;
          var destinationUrl = typeof injectedUrl === "string" ? injectedUrl.trim() : "";

          if (
            typeof mraid.open === "function" &&
            typeof window.isMraidUsable === "function" &&
            window.isMraidUsable(mraid)
          ) {
            try {
              mraid.open(destinationUrl);
              return;
            } catch (error) {
              console.error("mraid.open failed", error);
            }
          }
        };
      })();
    </script>
    <script>
      let mraidViewable = true;

      function syncMediaState() {
        window.__mraidViewable = mraidViewable;

        const media = document.querySelectorAll("video, audio");
        media.forEach(function (element) {
          if (!mraidViewable) {
            element.pause();
          } else if (element.tagName === "VIDEO" && element.autoplay) {
            element.play().catch(function () {});
          }
        });

        window.dispatchEvent(
          new CustomEvent("mraidViewableChange", {
            detail: { viewable: mraidViewable },
          }),
        );
      }

      function setupMraidViewability() {
        if (typeof mraid === "undefined") {
          syncMediaState();
          return;
        }

        function handleViewableChange(viewable) {
          mraidViewable = Boolean(viewable);
          syncMediaState();
        }

        if (typeof mraid.isViewable === "function") {
          try {
            mraidViewable = Boolean(mraid.isViewable());
          } catch (error) {
            mraidViewable = true;
          }
        }

        if (typeof mraid.addEventListener === "function") {
          mraid.addEventListener("viewableChange", handleViewableChange);
        }

        syncMediaState();
      }

      window.__mip.setupMediaViewability = setupMraidViewability;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
