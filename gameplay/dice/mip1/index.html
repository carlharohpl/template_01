<script>
      (function () {
        const readyBridges = new WeakSet();
        const trackedBridges = new WeakSet();

        function trackMraidReadiness(mraid) {
          if (
            !mraid ||
            trackedBridges.has(mraid) ||
            typeof mraid.addEventListener !== "function"
          ) {
            return;
          }

          try {
            mraid.addEventListener("ready", function () {
              readyBridges.add(mraid);
            });
            trackedBridges.add(mraid);
          } catch (error) {
            // getState() remains the primary readiness check.
          }
        }

        window.isMraidUsable = function (mraid) {
          if (!mraid) {
            return false;
          }

          trackMraidReadiness(mraid);
          if (typeof mraid.getState !== "function") {
            return true;
          }

          try {
            const state = mraid.getState();
            return state === "default" || state === "expanded";
          } catch (error) {
            return readyBridges.has(mraid);
          }
        };
      })();
    </script>
<script>
      (function () {
        window.__mip = window.__mip || {};

        window.__mip.ready = function (callback) {
          var completed = false;
          var removeReadyListener = null;
          function run() {
            if (completed) return;
            completed = true;
            if (removeReadyListener) {
              try { removeReadyListener("ready", run); } catch (error) {}
            }
            callback();
          }
          if (!window.mraid || typeof window.mraid.getState !== "function") { run(); return; }
          try {
            if (window.mraid.getState() === "loading") {
              if (typeof window.mraid.removeEventListener === "function") {
                removeReadyListener = window.mraid.removeEventListener.bind(window.mraid);
              }
              if (typeof window.mraid.addEventListener === "function") window.mraid.addEventListener("ready", run);
            } else {
              run();
            }
          } catch (error) { run(); }
        };

        // Resolve the injected destination and bridge at the moment of activation.
        window.__mip.openDestination = function handleMraidOpen() {
          var injectedUrl = window.clickTag;
          var destinationUrl = typeof injectedUrl === "string" ? injectedUrl.trim() : "";
          try {
            if (
              window.mraid &&
              typeof window.mraid.open === "function" &&
              typeof window.isMraidUsable === "function" &&
              window.isMraidUsable(window.mraid)
            ) {
              window.mraid.open(destinationUrl);
            }
          } catch (error) {
            console.error("mraid.open failed", error);
          }
        };
      })();
    </script>
<script>
      (function () {
        window.__mip = window.__mip || {};

        var mraidViewable = true;
        var pageHidden = false;
        var installed = false;
        var mediaDocuments = new Set();

        function syncMediaState() {
          var active = mraidViewable && !pageHidden && !document.hidden;
          mediaDocuments.forEach(function (doc) {
            doc.querySelectorAll("video, audio").forEach(function (element) {
              if (!active) element.pause();
              else if (element.tagName === "VIDEO" && element.autoplay) {
                try { Promise.resolve(element.play()).catch(function () {}); } catch (error) {}
              }
            });
          });
        }

        window.__mip.registerMediaDocument = function (doc) {
          if (!doc) return function () {};
          mediaDocuments.add(doc);
          function guardPlayback(event) {
            if ((!mraidViewable || pageHidden || document.hidden) && typeof event.target.pause === "function") event.target.pause();
          }
          doc.addEventListener("play", guardPlayback, true);
          syncMediaState();
          return function () {
            mediaDocuments.delete(doc);
            doc.removeEventListener("play", guardPlayback, true);
          };
        };

        window.__mip.setupMediaViewability = function () {
          if (installed) return;
          installed = true;
          window.__mip.registerMediaDocument(document);
          document.addEventListener("visibilitychange", syncMediaState);
          window.addEventListener("pagehide", function () { pageHidden = true; syncMediaState(); });
          window.addEventListener("pageshow", function () { pageHidden = false; syncMediaState(); });
          if (!window.mraid) return;
          function handleViewableChange(viewable) {
            mraidViewable = Boolean(viewable);
            syncMediaState();
          }
          if (typeof window.mraid.isViewable === "function") {
            try { mraidViewable = Boolean(window.mraid.isViewable()); } catch (error) {}
          }
          if (typeof window.mraid.addEventListener === "function") {
            try { window.mraid.addEventListener("viewableChange", handleViewableChange); } catch (error) {}
          }
          syncMediaState();
        };
      })();
    </script>
