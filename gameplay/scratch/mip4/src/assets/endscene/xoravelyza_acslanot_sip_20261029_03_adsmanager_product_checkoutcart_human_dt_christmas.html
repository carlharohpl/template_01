  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      /* iOS Safari auto-inflates small text on absolutely-positioned overlays
         even with the viewport meta. That breaks overlay position math, which
         caches text width before inflation. Pin to 100% to opt out. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      /* dvh tracks the *visible* viewport on iOS Safari, so it stays in sync
         with window.innerHeight regardless of URL-bar state. vh is kept as a
         fallback for browsers that don't support dvh. Without this, on long
         phones (e.g. iPhone Pro Max) in landscape, 100vh = URL-bar-collapsed
         height while innerHeight = URL-bar-expanded height; the orientation
         workaround sizes the container off the smaller value and CSS renders
         it at the larger one, throwing the overlay's cover-fit math off. */
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    #video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

      // 16:9 is the target content frame used to compute fit workaround.
      const targetAspectRatio = 16 / 9;

      // Some iOS Safari environments do not consistently fire pointer events.

        const now = Date.now();
        if (now - lastTapAt < 500) {

          event &&

        if (container.style.height !== height) {

 function update(){try{render();}catch(error){svg.style.visibility='hidden';host.dataset.overlayError=error.message;console.error('Xoravelyza date overlay:',error);ready=false;}}
 try{validate();const fonts=[...new Set(['portrait','landscape'].flatMap(o=>cfg[o].texts.map(t=>`${t.weight} ${t.size}px ${t.font}`)))];Promise.all([...fonts.map(font=>document.fonts.load(font)),...Object.values(cfg.assets).map(asset=>{const image=new Image();image.src=asset.dataUrl;return image.decode();})]).then(()=>{ready=true;update();}).catch(error=>{host.dataset.overlayError=error.message;console.error(error);});let frame=0;const tick=()=>{frame=0;if(document.hidden||video.paused)return;update();frame=requestAnimationFrame(tick);};const resume=()=>{if(!frame)frame=requestAnimationFrame(tick);};const pause=()=>{cancelAnimationFrame(frame);frame=0;};resume();video.addEventListener('play',resume);video.addEventListener('pause',pause);window.addEventListener('pagehide',pause);window.addEventListener('pageshow',resume);document.addEventListener('visibilitychange',()=>document.hidden?pause():resume());for(const event of ['pageshow','resize','orientationchange','popstate','hashchange'])window.addEventListener(event,update);document.addEventListener('visibilitychange',update);for(const event of ['loadedmetadata','loadeddata','seeked','timeupdate'])video.addEventListener(event,update);}catch(error){host.dataset.overlayError=error.message;console.error(error);}
})();
