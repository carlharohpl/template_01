    <script>
      // MRAID v2.0 readiness guard. Keep this immediately after the bridge
      // declaration so every later MRAID call can use the same state check.
      (function () {
        let mraidIsReady = false;
        let mraidReadyListenerAttached = false;

        function trackMraidReadiness(mraid) {
          if (
            mraidReadyListenerAttached ||
            !mraid ||
            typeof mraid.addEventListener !== "function"
          ) {
            return;
          }

          try {
            mraid.addEventListener("ready", () => {
              mraidIsReady = true;
            });
            mraidReadyListenerAttached = true;
          } catch (_error) {
            // Non-standard preview bridges may throw here. getState() remains
            // the primary readiness signal in compliant MRAID containers.
          }
        }

        window.isMraidUsable = function (mraid) {
          if (!mraid) {
            return false;
          }

          trackMraidReadiness(mraid);

          // Minimal preview mocks sometimes omit getState().
          if (typeof mraid.getState !== "function") {
            return true;
          }

          try {
            const state = mraid.getState();
            return state === "default" || state === "expanded";
          } catch (_error) {
            return mraidIsReady;
          }
        };
      })();
    </script>

      // 16:9 is the target content frame used to compute fit workaround.
      const targetAspectRatio = 16 / 9;
      // Threshold for triggering extreme aspect-ratio compensation.
      const extremeRatioThreshold = 1.8;

      const video = document.getElementById("sip-video");
      const source = document.getElementById("sip-video-source");
      const container = document.getElementById("video-container");

      if (!video || !source || !container) {
        throw new Error("Required SIP video elements are unavailable.");
      }

      video.addEventListener("playing", () => signalPlayableLifecycle("gameStart"), {
        once: true,
      });
      video.addEventListener("ended", () => signalPlayableLifecycle("gameEnd"));

      // MRAID destination handling.
      // interactive state. Browser previews log clicks without navigating.
      function handleClickAction() {
        console.log("CTA clicked");
        var mraid = window.mraid || {};
        var injectedUrl = window.clickTag;
        var destinationUrl = typeof injectedUrl === "string" ? injectedUrl.trim() : "";
        if (typeof mraid.open === "function" && typeof window.isMraidUsable === "function" && window.isMraidUsable(mraid)) {
          try { mraid.open(destinationUrl); } catch (error) { console.error("mraid.open failed", error); }
        }

      let lastTapAt = 0;

      // Some iOS Safari environments do not consistently fire pointer events.
      function handleTap(event) {
        const now = Date.now();
        if (now - lastTapAt < 500) {
          return;
        }

        if (
          event &&
          (event.type === "touchend" ||
            event.type === "pointerup" ||
            event.type === "click")
        ) {
          lastTapAt = now;
        }

        handleClickAction();
      }

      // Writes size only when changed to avoid unnecessary style churn.
      function setContainerSize(widthPct, heightPct) {
        const width = `${widthPct}%`;
        const height = `${heightPct}%`;
        if (container.style.width !== width) {
          container.style.width = width;
        }
        if (container.style.height !== height) {
          container.style.height = height;
        }
      }

      // Returns the container to full-screen footprint.
      function resetContainer() {
        setContainerSize(100, 100);
      }

      // Applies source + sizing based on current viewport orientation and ratio.
      function setVideoForOrientation() {
        // matchMedia is wired to the CSS @media (orientation:) query, which
        // resolves from the actual device orientation. window.innerWidth/Height
        // can lag during orientation transitions on long iOS devices (e.g.
        // iPhone Pro Max), still reporting the previous orientation's dims for
        // several frames after the rotation completes.
        const isPortrait = window.matchMedia
          ? !window.matchMedia("(orientation: landscape)").matches
          : window.innerHeight > window.innerWidth;

        // the device's long edge is the long edge regardless. Assign to
        // width/height by the orientation we trust (matchMedia), so even if
        // innerWidth/innerHeight are momentarily swapped, the workaround math
        // below operates on the correct axes and never produces a 385%-wide
        // container that corrupts subsequent rotations.
        const dimA = window.innerWidth;
        const dimB = window.innerHeight;
        const longSide = Math.max(dimA, dimB);
        const shortSide = Math.min(dimA, dimB);
        const width = isPortrait ? shortSide : longSide;
        const height = isPortrait ? longSide : shortSide;
        const src = isPortrait ? srcPortrait : srcLandscape;
        const normalizedRatio =
          width > height ? width / height : height / width;

        resetContainer();

      // Schedules a single layout update per animation frame.
      function scheduleOrientationUpdate() {

          return;
        }

        pendingFrame = window.requestAnimationFrame(() => {
          pendingFrame = 0;
          setVideoForOrientation();

      function attachActiveListeners() {

          return;
        }

        listenersController = new AbortController();
        const { signal } = listenersController;

        window.addEventListener("resize", scheduleOrientationUpdate, {
          signal,
          passive: true,
